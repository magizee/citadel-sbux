merge:
  # Server-reported total for location="United States" (2026-10-01), used as a
  # completeness cross-check for the national grid. Update on each snapshot.
  national_count_query: "United States"
  # Flag a state if fewer unique postings than this were assigned to it.
  low_count_threshold: 25
